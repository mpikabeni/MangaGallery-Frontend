<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta
name="viewport"
content="width=device-width,initial-scale=1.0">
<meta
http-equiv="X-UA-Compatible"
content="IE=edge">
<meta
name="description"
content="Importer - Manga Gallery FR">
<meta
name="theme-color"
content="#7C5CFF">
<title>
Gestion des Mangas • Manga Gallery FR
</title>
<link
rel="icon"
type="image/png"
href="assets/logo.png">
<link
rel="preconnect"
href="https://fonts.googleapis.com">
<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>
<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">
<link
rel="stylesheet"
href="css/dashboard.css">
<link
rel="stylesheet"
href="css/mangas.css">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: https: http:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'">
<script src="../js/config.js"></script>
<script src="js/safe-html.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js" defer></script>
<link rel="stylesheet" href="css/import.css">
<link rel="stylesheet" href="../css/themes.css">
<link rel="stylesheet" href="css/theme.css">
<script src="../js/theme.js"></script>
<script src="js/theme-boot.js"></script>
</head>
<body>
<div class="dashboard">
<aside class="sidebar"></aside>
<main class="main-content">

<header class="topbar">
  <div class="page-title">
    <h1>Importer depuis les sites</h1>
    <p>7 sources : une partie par site. MangaDex et Internet Archive ajoutent aussi les chapitres, les autres importent la fiche.</p>
  </div>
</header>

<nav class="source-tabs" id="source-tabs" role="tablist" aria-label="Sources">
  <button type="button" class="source-tab active" data-source="mangadex"><b>MangaDex</b><small>fiche + chapitres</small></button>
  <button type="button" class="source-tab" data-source="anilist"><b>AniList</b><small>fiche</small></button>
  <button type="button" class="source-tab" data-source="jikan"><b>MyAnimeList</b><small>via Jikan · fiche</small></button>
  <button type="button" class="source-tab" data-source="kitsu"><b>Kitsu</b><small>fiche</small></button>
  <button type="button" class="source-tab" data-source="mangaupdates"><b>MangaUpdates</b><small>fiche</small></button>
  <button type="button" class="source-tab" data-source="internetarchive"><b>Internet Archive</b><small>BD libres · chapitre complet</small></button>
  <button type="button" class="source-tab" data-source="googlebooks"><b>BD · Google Books</b><small>bandes dessinées · fiche</small></button>
</nav>

<section class="toolbar">
  <div class="toolbar-left">
    <div class="section-tabs" id="section-tabs" role="tablist">
      <button type="button" class="tab active" data-section="normal">Galerie</button>
      <button type="button" class="tab adult" data-section="sainte_culture">La Sainte Culture · 18+</button>
    </div>
    <div class="search-box"><i data-lucide="search"></i><input type="search" id="q" placeholder="Titre (vide = les plus suivis)" autocomplete="off"></div>
    <select id="format" class="filter-select" aria-label="Origine">
      <option value="">Toutes origines</option><option value="manhwa">Manhwa (Corée)</option>
      <option value="manhua">Manhua (Chine)</option><option value="manga">Manga (Japon)</option>
    </select>
    <select id="bd-lang" class="filter-select bd-only hidden" aria-label="Langue des BD">
      <option value="fr">BD en français</option><option value="en">BD en anglais</option><option value="all">Toutes les langues</option>
    </select>
    <select id="lang" class="filter-select mdx-only">
      <option value="fr">Chapitres en français (VF)</option><option value="en">Chapitres en anglais</option>
      <option value="es">Español</option><option value="pt-br">Português (BR)</option>
    </select>
  </div>
  <div class="toolbar-right">
    <button id="go" class="primary-button" type="button"><i data-lucide="search"></i><span>Rechercher</span></button>
  </div>
</section>

<section class="options">
  <label class="check mdx-only"><input type="checkbox" id="only-completed" checked><span>Séries <b>terminées</b> seulement</span></label>
  <label class="check mdx-only"><input type="checkbox" id="only-complete" checked><span>Seulement si <b>tous les chapitres</b> existent dans cette langue</span></label>
  <label class="check mdx-only"><input type="checkbox" id="coming-mode"><span>Mode <b>« Bientôt »</b> : voir les titres <b>pas encore complets</b> en français et les ajouter comme « à venir » (sans chapitres)</span></label>
  <label class="check mdx-only"><input type="checkbox" id="notify" checked><span><b>Prévenir les utilisateurs</b> (bot + application) à la sortie</span></label>
  <label class="check cat-only hidden"><span>Après l'import :&nbsp;
    <select id="visibility" class="filter-select"><option value="public">afficher dans « Bientôt » (sans chapitres)</option><option value="hidden">garder masqué (brouillon)</option></select></span></label>
</section>
<div class="coming-actions mdx-only"><button id="check-coming" class="secondary-button" type="button">Vérifier maintenant les titres « Bientôt » devenus complets</button></div>
<p id="hidden-note" class="hidden-note hidden"></p>
<div class="coming-actions"><button id="translate-old" class="secondary-button" type="button"><i data-lucide="languages"></i><span>Traduire en français les synopsis déjà importés</span></button></div>
<p id="translate-note" class="hidden-note hidden"></p>

<section class="notice" id="notice"></section>

<section id="results" class="import-grid" aria-live="polite"></section>
<div class="import-more"><button id="more" class="secondary-button hidden" type="button">Voir plus de résultats</button></div>

</main>
</div>
<script src="js/helpers.js"></script>
<script src="js/toast.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/import.js"></script>
<script src="js/page-boot.js"></script>
</body>
</html>
