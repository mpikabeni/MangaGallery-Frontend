<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<meta
    http-equiv="X-UA-Compatible"
    content="IE=edge">

<meta
    name="description"
    content="Gestion des notifications - Nexa Admin">

<meta
    name="theme-color"
    content="#7C5CFF">

<title>Gestion des Notifications • Manga Gallery FR</title>

<link
    rel="icon"
    type="image/png"
    href="assets/logo.png">

<link
    rel="preconnect"
    href="https://fonts.googleapis.com">

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

<link
    rel="stylesheet"
    href="css/dashboard.css">

<link
    rel="stylesheet"
    href="css/notifications.css">













<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: https: http:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'">
<script src="../js/config.js"></script>
<script src="js/safe-html.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js" defer></script>
</head>

<body>

<div class="dashboard">

<aside
    class="sidebar"
    aria-label="Navigation principale">

    <!-- Sidebar du Dashboard -->

</aside>

<main class="main-content">

<header class="topbar">

<div class="page-title">

<h1>
Gestion des Notifications
</h1>

<p>
Créer, programmer et envoyer des notifications
</p>

</div>

<div class="topbar-actions">

<button
    type="button"
    id="refresh-notifications"
    class="secondary-button"
    aria-label="Actualiser les notifications">

    <i data-lucide="refresh-cw"></i>

    <span>
    Actualiser
    </span>

</button>

<button
    type="button"
    id="add-notification"
    class="primary-button"
    aria-haspopup="dialog"
    aria-controls="notification-modal">

    <i data-lucide="plus"></i>

    <span>
    Nouvelle notification
    </span>

</button>

</div>

</header>


<section
    class="toolbar"
    aria-label="Filtres des notifications">

<div class="toolbar-left">

<div class="search-box">

<i data-lucide="search"></i>

<input
    type="search"
    id="search-notification"
    placeholder="Rechercher une notification..."
    autocomplete="off"
    spellcheck="false"
    aria-label="Rechercher une notification">

</div>


<select
    id="type-filter"
    class="filter-select"
    aria-label="Filtrer par type">

<option value="">
Tous les types
</option>

<option value="system">
Système
</option>

<option value="manga">
Manga
</option>

<option value="user">
Utilisateur
</option>

<option value="promotion">
Promotion
</option>

</select>


<select
    id="status-filter"
    class="filter-select"
    aria-label="Filtrer par statut">

<option value="">
Tous les statuts
</option>

<option value="sent">
Envoyée
</option>

<option value="pending">
En attente
</option>

<option value="failed">
Échec
</option>

</select>

</div>

</section>


<section
    class="table-section"
    id="notifications-section"
    aria-labelledby="notifications-heading">

<div class="table-header">

<h2 id="notifications-heading">
Liste des notifications
</h2>

<div class="table-actions">

<span
    id="notification-count"
    aria-live="polite">
0 notifications
</span>

</div>

</div>


<div class="table-container">

<table class="admin-table">

<thead>

<tr>

<th scope="col">
Titre
</th>

<th scope="col">
Destinataire
</th>

<th scope="col">
Type
</th>

<th scope="col">
Priorité
</th>

<th scope="col">
Statut
</th>

<th scope="col">
Programmation
</th>

<th scope="col">
Actions
</th>

</tr>

</thead>

<tbody id="notifications-table-body">

<tr>

<td
    colspan="7"
    class="loading-row"
    aria-live="polite">

    Chargement des notifications...

</td>

</tr>

</tbody>

</table>

</div>


<div
    class="pagination"
    aria-label="Pagination des notifications">

<button
    type="button"
    id="previous-page"
    class="secondary-button"
    aria-label="Page précédente">

    <i data-lucide="chevron-left"></i>

    <span>
    Précédent
    </span>

</button>

<div class="pagination-info">

<span
    id="pagination-info"
    aria-live="polite">
Page 1 sur 1
</span>

</div>

<button
    type="button"
    id="next-page"
    class="secondary-button"
    aria-label="Page suivante">

    <span>
    Suivant
    </span>

    <i data-lucide="chevron-right"></i>

</button>

</div>

</section>

<!--==================================
NOTIFICATION MODAL
===================================-->

<div
    id="notification-modal"
    class="modal hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="notification-modal-title"
    aria-hidden="true">

<div class="modal-content">

<div class="modal-header">

<h2 id="notification-modal-title">
Nouvelle notification
</h2>

<button
    type="button"
    id="close-notification-modal"
    class="icon-button"
    aria-label="Fermer la fenêtre">

    <i data-lucide="x"></i>

</button>

</div>


<form
    id="notification-form"
    autocomplete="off"
    novalidate>

<input
    type="hidden"
    id="notification-id">


<div class="form-group">

<label for="notification-title">
Titre
</label>

<input
    type="text"
    id="notification-title"
    maxlength="120"
    required
    autocomplete="off">

</div>


<div class="form-grid">

<div class="form-group">

<label for="notification-target">
Destinataire
</label>

<select
    id="notification-target"
    required>

<option value="all">
Tous les utilisateurs
</option>

<option value="user">
Utilisateur spécifique
</option>

<option value="manga">
Abonnés d'un manga
</option>

<option value="category">
Abonnés d'une catégorie
</option>

</select>

</div>


<div class="form-group">

<label for="notification-type">
Type
</label>

<select
    id="notification-type"
    required>

<option value="system">
Système
</option>

<option value="manga">
Manga
</option>

<option value="promotion">
Promotion
</option>

<option value="announcement">
Annonce
</option>

</select>

</div>

</div>


<div class="form-group">

<label for="notification-message">
Message
</label>

<textarea
    id="notification-message"
    rows="6"
    maxlength="1000"
    required></textarea>

</div>


<div class="form-grid">

<div class="form-group">

<label for="notification-priority">
Priorité
</label>

<select
    id="notification-priority"
    required>

<option value="normal">
Normale
</option>

<option value="important">
Importante
</option>

<option value="urgent">
Urgente
</option>

</select>

</div>


<div class="form-group">

<label for="notification-date">
Date de programmation
</label>

<input
    type="datetime-local"
    id="notification-date">

</div>

</div>


<div class="form-group">

<label for="notification-link">
Lien (optionnel)
</label>

<input
    type="url"
    id="notification-link"
    placeholder="https://"
    autocomplete="url">

</div>


<div class="modal-actions">

<button
    type="button"
    id="cancel-notification-button"
    class="secondary-button">

    Annuler

</button>


<button
    type="button"
    id="schedule-notification-button"
    class="secondary-button">

    Programmer

</button>


<button
    type="submit"
    id="send-notification-button"
    class="primary-button">

    <i data-lucide="send"></i>

    <span>
    Envoyer
    </span>

</button>

</div>

</form>

</div>

</div>


</main>

</div>















<script src="js/helpers.js"></script>
<script src="js/toast.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/notifications.js"></script>
<script src="js/page-boot.js"></script>
</body>

</html>
