<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<meta
http-equiv="X-UA-Compatible"
content="IE=edge">

<meta
name="description"
content="Gestion des catégories - Nexa Admin">

<meta
name="theme-color"
content="#7C5CFF">

<title>

Gestion des Catégories • Manga Gallery FR

</title>

<link
rel="icon"
type="image/png"
href="assets/logo.png">

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="css/dashboard.css">

<link
rel="stylesheet"
href="css/categories.css">













<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: https: http:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'">
<script src="../js/config.js"></script>
<script src="js/safe-html.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js" defer></script>
<link rel="stylesheet" href="../css/themes.css">
<link rel="stylesheet" href="css/theme.css">
<script src="../js/theme.js"></script>
<script src="js/theme-boot.js"></script>
</head>

<body>

<div class="dashboard">

<aside class="sidebar"></aside>

<main class="main-content">

<header class="topbar">

<div class="page-title">

<h1>

Gestion des Catégories

</h1>

<p>

Ajouter, modifier et organiser les catégories

</p>

</div>

<button
type="button"
id="add-category"
class="primary-button">

<i data-lucide="plus"></i>

<span>

Ajouter une catégorie

</span>

</button>

</header>

<section class="toolbar">

<div class="toolbar-left">

<div class="search-box">

<i data-lucide="search"></i>

<input
type="search"
id="search-category"
placeholder="Rechercher une catégorie..."
autocomplete="off">

</div>

<select
id="status-filter"
class="filter-select">

<option value="">

Tous les statuts

</option>

<option value="active">

Active

</option>

<option value="disabled">

Désactivée

</option>

</select>

</div>

<div class="toolbar-right">

<button
type="button"
id="refresh-categories"
class="secondary-button">

<i data-lucide="refresh-cw"></i>

<span>

Actualiser

</span>

</button>

</div>

</section>

<section class="table-section">

<div class="table-header">

<h2>

Liste des catégories

</h2>

<div class="table-actions">

<span id="category-count">

0 catégories

</span>

</div>

</div>

<div class="table-container">

<table class="admin-table">

<thead>

<tr>

<th>

Icône

</th>

<th>

Nom

</th>

<th>

Slug

</th>

<th>

Couleur

</th>

<th>

Mangas

</th>

<th>

Statut

</th>

<th>

Créée le

</th>

<th>

Actions

</th>

</tr>

</thead>

<tbody id="categories-table-body">

<tr>

<td
colspan="8"
class="loading-row">

Chargement des catégories...

</td>

</tr>

</tbody>

</table>

</div>

<div class="pagination">

<button
type="button"
id="previous-page"
class="secondary-button">

<i data-lucide="chevron-left"></i>

<span>

Précédent

</span>

</button>

<div class="pagination-info">

<span id="pagination-info">

Page 1 sur 1

</span>

</div>

<button
type="button"
id="next-page"
class="secondary-button">

<span>

Suivant

</span>

<i data-lucide="chevron-right"></i>

</button>

</div>

</section>

<!--==================================
ADD / EDIT CATEGORY MODAL
===================================-->

<div
id="category-modal"
class="modal hidden">

<div class="modal-content">

<div class="modal-header">

<h2 id="category-modal-title">

Ajouter une catégorie

</h2>

<button
type="button"
id="close-category-modal"
class="icon-button">

<i data-lucide="x"></i>

</button>

</div>

<form id="category-form">

<input
type="hidden"
id="category-id">

<div class="form-grid">

<div class="form-group">

<label for="category-name">

Nom

</label>

<input
type="text"
id="category-name"
required>

</div>

<div class="form-group">

<label for="category-slug">

Slug

</label>

<input
type="text"
id="category-slug"
readonly>

</div>

</div>

<div class="form-grid">

<div class="form-group">

<label for="category-color">

Couleur

</label>

<input
type="color"
id="category-color"
value="#7C5CFF">

</div>

<div class="form-group">

<label for="category-status">

Statut

</label>

<select
id="category-status">

<option value="active">

Active

</option>

<option value="disabled">

Désactivée

</option>

</select>

</div>

</div>

<div class="form-group">

<label for="category-icon">

Icône / Image

</label>

<input
type="file"
id="category-icon"
accept="image/*">

</div>

<div class="form-group">

<label>

Aperçu

</label>

<div class="cover-preview">

<img
id="icon-preview"
src="assets/default-category.png"
alt="Icône">

</div>

</div>

<div class="form-group">

<label for="category-description">

Description

</label>

<textarea
id="category-description"
rows="5">

</textarea>

</div>

<div class="modal-actions">

<button
type="button"
id="cancel-category-button"
class="secondary-button">

Annuler

</button>

<button
type="submit"
id="save-category-button"
class="primary-button">

<i data-lucide="save"></i>

<span>

Enregistrer

</span>

</button>

</div>

</form>

</div>

</div>

</main>

</div>













<script src="js/helpers.js"></script>
<script src="js/toast.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/categories.js"></script>
<script src="js/page-boot.js"></script>
</body>

</html>
