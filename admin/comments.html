<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<meta
http-equiv="X-UA-Compatible"
content="IE=edge">

<meta
name="description"
content="Gestion des commentaires - Nexa Admin">

<meta
name="theme-color"
content="#7C5CFF">

<title>

Gestion des Commentaires • Manga Gallery FR

</title>

<link
rel="icon"
type="image/png"
href="assets/logo.png">

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="css/dashboard.css">

<link
rel="stylesheet"
href="css/comments.css">













<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: https: http:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'">
<script src="../js/config.js"></script>
<script src="js/safe-html.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js" defer></script>
</head>

<body>

<div class="dashboard">

<aside class="sidebar"></aside>

<main class="main-content">

<header class="topbar">

<div class="page-title">

<h1>

Gestion des Commentaires

</h1>

<p>

Modérer et gérer les commentaires des utilisateurs

</p>

</div>

<button
type="button"
id="refresh-comments"
class="secondary-button">

<i data-lucide="refresh-cw"></i>

<span>

Actualiser

</span>

</button>

</header>

<section class="toolbar">

<div class="toolbar-left">

<div class="search-box">

<i data-lucide="search"></i>

<input
type="search"
id="search-comment"
placeholder="Rechercher un commentaire..."
autocomplete="off">

</div>

<select
id="status-filter"
class="filter-select">

<option value="">

Tous les statuts

</option>

<option value="published">

Publié

</option>

<option value="hidden">

Masqué

</option>

<option value="reported">

Signalé

</option>

</select>

</div>

</section>

<section class="table-section">

<div class="table-header">

<h2>

Liste des commentaires

</h2>

<div class="table-actions">

<span id="comment-count">

0 commentaires

</span>

</div>

</div>

<div class="table-container">

<table class="admin-table">

<thead>

<tr>

<th>Avatar</th>

<th>Utilisateur</th>

<th>Manga</th>

<th>Chapitre</th>

<th>Commentaire</th>

<th>Signalements</th>

<th>Statut</th>

<th>Date</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="comments-table-body">

<tr>

<td
colspan="9"
class="loading-row">

Chargement des commentaires...

</td>

</tr>

</tbody>

</table>

</div>

<div class="pagination">

<button
type="button"
id="previous-page"
class="secondary-button">

<i data-lucide="chevron-left"></i>

<span>

Précédent

</span>

</button>

<div class="pagination-info">

<span id="pagination-info">

Page 1 sur 1

</span>

</div>

<button
type="button"
id="next-page"
class="secondary-button">

<span>

Suivant

</span>

<i data-lucide="chevron-right"></i>

</button>

</div>

</section>

<!--==================================
COMMENT DETAILS MODAL
===================================-->

<div
id="comment-modal"
class="modal hidden">

<div class="modal-content">

<div class="modal-header">

<h2 id="comment-modal-title">

Détails du commentaire

</h2>

<button
type="button"
id="close-comment-modal"
class="icon-button">

<i data-lucide="x"></i>

</button>

</div>

<form id="comment-form">

<input
type="hidden"
id="comment-id">

<div class="profile-preview">

<img
id="comment-avatar"
src="assets/logo.png"
alt="Avatar">

</div>

<div class="form-group">

<label for="comment-user">

Utilisateur

</label>

<input
type="text"
id="comment-user"
readonly>

</div>

<div class="form-grid">

<div class="form-group">

<label for="comment-manga">

Manga

</label>

<input
type="text"
id="comment-manga"
readonly>

</div>

<div class="form-group">

<label for="comment-chapter">

Chapitre

</label>

<input
type="text"
id="comment-chapter"
readonly>

</div>

</div>

<div class="form-group">

<label for="comment-content">

Commentaire

</label>

<textarea
id="comment-content"
rows="7"
readonly>

</textarea>

</div>

<div class="form-grid">

<div class="form-group">

<label for="comment-status">

Statut

</label>

<select id="comment-status">

<option value="published">

Publié

</option>

<option value="hidden">

Masqué

</option>

<option value="reported">

Signalé

</option>

</select>

</div>

<div class="form-group">

<label for="comment-reports">

Nombre de signalements

</label>

<input
type="number"
id="comment-reports"
readonly>

</div>

</div>

<div class="form-grid">

<div class="form-group">

<label for="comment-date">

Date

</label>

<input
type="text"
id="comment-date"
readonly>

</div>

<div class="form-group">

<label for="comment-last-update">

Dernière modification

</label>

<input
type="text"
id="comment-last-update"
readonly>

</div>

</div>

<div class="form-group">

<label for="moderator-note">

Note du modérateur

</label>

<textarea
id="moderator-note"
rows="5">

</textarea>

</div>

<div class="modal-actions">

<button type="button" id="close-comment-button" class="secondary-button">Fermer</button>
<button
type="button"
id="hide-comment-button"
class="secondary-button">

Masquer

</button>

<button
type="button"
id="restore-comment-button"
class="secondary-button">

Restaurer

</button>

<button
type="button"
id="delete-comment-button"
class="secondary-button">

Supprimer

</button>

<button
type="submit"
id="save-comment-button"
class="primary-button">

<i data-lucide="save"></i>

<span>

Enregistrer

</span>

</button>

</div>

</form>

</div>

</div>

</main>

</div>













<script src="js/helpers.js"></script>
<script src="js/toast.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/comments.js"></script>
<script src="js/page-boot.js"></script>
</body>

</html>
