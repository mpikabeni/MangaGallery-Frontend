<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<meta
http-equiv="X-UA-Compatible"
content="IE=edge">

<meta
name="description"
content="Nexa Administration">

<meta
name="theme-color"
content="#7C5CFF">

<title>

Connexion • Nexa Admin

</title>

<link
rel="icon"
type="image/png"
href="assets/logo.png">

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="css/login.css">













<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: https: http:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'">
<script src="../js/config.js"></script>
<script src="js/safe-html.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js" defer></script>
<link rel="stylesheet" href="../css/themes.css">
<link rel="stylesheet" href="css/theme.css">
<script src="../js/theme.js"></script>
<script src="js/theme-boot.js"></script>
</head>

<body>

<div
class="login-page">

<div
class="login-container">

<div
class="login-card">

<div
class="login-header">

<img

src="assets/logo.png"

alt="Manga Gallery FR"

class="login-logo">

<h1>

Manga Gallery FR

</h1>

<p>

Administration

</p>

</div>

<p id="tg-note" style="display:none;text-align:center;line-height:1.5;opacity:.85;margin:8px 0 18px">Ouvre l'administration depuis l'application Manga Gallery FR dans Telegram :<br><b>Réglages → Version</b> (5 appuis).</p>
<form id="login-form"

autocomplete="off">

<div
class="form-group">

<label
for="username">

Nom d'utilisateur

</label>

<input

type="text"

id="username"

name="username"

placeholder="Entrez votre nom d'utilisateur"

autocomplete="username"

required>

</div>

<div
class="form-group">

<label
for="password">

Mot de passe

</label>

<div
class="password-wrapper">

<input

type="password"

id="password"

name="password"

placeholder="Entrez votre mot de passe"

autocomplete="current-password"

required>

<button

type="button"

id="toggle-password"

class="password-toggle">

<i
data-lucide="eye">

</i>

</button>

</div>

</div>

<div

id="login-error"

class="error-message">

</div>

<div
class="remember-row">

<label
class="remember-me">

<input

type="checkbox"

id="remember-me"

name="remember-me">

<span>

Se souvenir de moi

</span>

</label>

<a href="#" id="forgot-password" style="display:none"

class="forgot-password">

Mot de passe oublié ?

</a>

</div>


<button

type="submit"

id="login-button"

class="primary-button">

<i
data-lucide="log-in">

</i>

<span>

Connexion

</span>

</button>


<div

id="login-loader"

class="login-loader">

<div
class="loader-spinner">

</div>

<span>

Connexion en cours...

</span>

</div>

</form>


<div
class="login-footer">

<p>

© 2026 Nexa · @Nexa_CG

</p>

<p>

Version Finale

</p>

</div>

</div>

</div>



<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/login.js"></script>
</body>

</html>
